{% extends "base.html" %}
{% block title %}Edit Transaction — FinFlow{% endblock %}
{% block page_title %}Edit Transaction{% endblock %}
{% block content %}
<div class="card card-centered-lg">
  <div class="flex jc-between ai-center mb-3">
    <div class="form-page-title">Edit Transaction</div>
    <a href="{{ url_for('transactions') }}" class="btn btn-ghost btn-sm">← Back</a>
  </div>
  <form method="POST">
    {{ csrf_field() }}
    <div class="g g2">
      <div class="form-group">
        <label>Date *</label>
        <input type="date" name="date" class="form-control" value="{{ txn.date.isoformat() }}" title="Transaction date" required>
      </div>
      <div class="form-group">
        <label>Amount (₹) *</label>
        <input type="number" name="amount" class="form-control" value="{{ txn.amount }}" title="Transaction amount" step="0.01" min="0.01" required>
      </div>
    </div>
    <div class="g g2">
      <div class="form-group">
        <label>Category *</label>
        <select name="category_id" class="form-control" title="Transaction category" required>
          <option value="">Select category</option>
          {% set ns = namespace(prev='') %}
          {% for c in categories %}
            {% if c.name != ns.prev %}
              {% if ns.prev %}</optgroup>{% endif %}
              <optgroup label="{{ c.name }}">{% set ns.prev = c.name %}
            {% endif %}
            <option value="{{ c.id }}" {% if txn.category_id==c.id %}selected{% endif %}>{{ c.subcategory }}</option>
          {% endfor %}
          {% if categories %}</optgroup>{% endif %}
        </select>
      </div>
      <div class="form-group">
        <label>Transaction Type *</label>
        <select name="txn_type" class="form-control" title="Transaction Type" required>
          <option value="">Select type</option>
          <option value="Credit" {% if txn.txn_type=='Income' %}selected{% endif %}>Credit</option>
          <option value="Debit" {% if txn.txn_type=='Expense' %}selected{% endif %}>Debit</option>
          <option value="Not Reported" {% if txn.txn_type=='Not Reported' %}selected{% endif %}>Not Reported</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Payment Mode *</label>
      <select name="payment_mode" class="form-control" title="Payment mode" required>
        {% for pm in ['Cash','Wallet','Credit Card','Debit Card','NEFT','RTGS','IMPS','UPI','NACH','Net Banking','Cheque','EMI','Auto Debit'] %}
        <option {% if txn.payment_mode==pm %}selected{% endif %}>{{ pm }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Account</label>
      <select name="account_id" class="form-control" title="Associated account">
        <option value="">No account</option>
        {% for acc in accounts %}
        <option value="{{ acc.id }}" {% if txn.account_id==acc.id %}selected{% endif %}>{{ acc.icon }} {{ acc.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" name="description" class="form-control" value="{{ txn.description or '' }}" title="Transaction description" placeholder="What was this transaction for?">
    </div>
    <div class="g g2">
      <div class="form-group">
        <label>Reference No.</label>
        <input type="text" name="reference_no" class="form-control" value="{{ txn.reference_no or '' }}" title="Reference number">
      </div>
      <div class="form-group">
        <label>Tags</label>
        <input type="text" name="tags" class="form-control" value="{{ txn.tags or '' }}" title="Transaction tags">
      </div>
    </div>
    <div class="flex gap-2">
      <button type="submit" class="btn btn-primary">Update Transaction</button>
      <a href="{{ url_for('transactions') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
