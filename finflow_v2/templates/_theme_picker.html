<div class="theme-picker" data-theme-picker>
  <button class="theme-picker-trigger" type="button" data-theme-picker-trigger aria-label="Choose appearance" aria-expanded="false">
    <span class="theme-picker-icon" data-theme-icon aria-hidden="true">◐</span>
    <span class="theme-picker-label">Appearance</span>
    <span class="theme-picker-chevron" aria-hidden="true">⌄</span>
  </button>
  <div class="theme-picker-menu" role="group" aria-label="Appearance options" hidden>
    <span class="theme-picker-title">Appearance</span>
    <button type="button" data-theme-option="light">
      <span aria-hidden="true">☀️</span><span><strong>Light</strong><small>Clean and bright</small></span>
    </button>
    <button type="button" data-theme-option="dark">
      <span aria-hidden="true">🌙</span><span><strong>Dark</strong><small>Easy on the eyes</small></span>
    </button>
    <button type="button" data-theme-option="system">
      <span aria-hidden="true">◐</span><span><strong>System default</strong><small>Matches your device</small></span>
    </button>
  </div>
</div>
